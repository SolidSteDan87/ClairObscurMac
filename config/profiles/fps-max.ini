; Profil « fps-max » — le maximum de FPS sur M2 Max : profil « fluide » + éclairage
; global Lumen remplacé par un éclairage en espace écran (SSGI). Éclairage plus plat
; en intérieur ; Nanite (vraies fleurs) reste actif.
; Gains mesurés au marché de Lumière (réglages Moyen, M2 Max) dans les commentaires.
[SystemSettings]
; Effets : -1,7 ms (brouillard volumétrique, éclairage des particules translucides,
; flou de mouvement, profondeur de champ, aberration chromatique)
r.VolumetricFog=0
r.TranslucencyLightingVolume=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.SceneColorFringeQuality=0
; Upscaler : FSR 4 (prévu pour les GPU AMD récents) remplacé par DLSS->MetalFX,
; ou TSR à défaut : -1 ms
r.FidelityFX.FSR4.Enabled=0
r.NGX.DLSS.Enable=1
r.ScreenPercentage=50
; Reflets en espace écran au lieu des reflets Lumen (l'éclairage global Lumen reste)
r.ReflectionMethod=2
; Nanite un peu moins dense (triangles de 2 pixels au lieu de 1)
r.Nanite.MaxPixelsPerEdge=2
; Synchro verticale coupée : à ~17 ms par image, la synchro à 120 Hz fait alterner
; 60 et 40 FPS (saccades) ; sans elle, ~58 FPS réguliers. (Engine.ini l'emporte
; sur le réglage du jeu, stocké dans la sauvegarde.)
r.VSync=0
; Éclairage global en espace écran au lieu de Lumen
r.DynamicGlobalIlluminationMethod=2
