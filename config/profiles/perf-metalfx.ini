; Test FPS — FSR 4 remplacé par DLSS, que D3DMetal convertit en MetalFX
; (D3DM_ENABLE_METALFX=1, activé par coe). Si DLSS n'est pas accepté, Unreal
; repasse sur son upscaler natif TSR. Résolution interne inchangée (50 %).
[SystemSettings]
r.FidelityFX.FSR4.Enabled=0
r.NGX.DLSS.Enable=1
r.ScreenPercentage=50
