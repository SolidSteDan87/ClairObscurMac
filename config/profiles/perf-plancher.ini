; Diagnostic FPS — « plancher » : tous les gros consommateurs coupés d'un coup,
; pour savoir si le coût GPU vient des effets du jeu ou de la traduction D3DMetal.
; Image volontairement dégradée (Nanite coupé) : ne pas jouer avec.
[SystemSettings]
r.DynamicGlobalIlluminationMethod=2
r.ReflectionMethod=2
r.Nanite=0
r.VolumetricFog=0
r.TranslucencyLightingVolume=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.SceneColorFringeQuality=0
