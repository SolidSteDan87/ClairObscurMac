; Profil « beau » — le plus beau rendu sur M2 Max, à fréquence d'image stable.
; Qualités au maximum (Épique) ; écrites ici car Engine.ini l'emporte sur les
; réglages du jeu (stockés dans la sauvegarde).
[SystemSettings]
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
sg.LandscapeQuality=3
; Image plus nette : 75 % de résolution interne, upscaler DLSS -> MetalFX
; (TSR à défaut) au lieu de FSR 4
r.FidelityFX.FSR4.Enabled=0
r.NGX.DLSS.Enable=1
r.ScreenPercentage=75
; Flou de mouvement coupé (il étale toute l'image à chaque mouvement de caméra)
r.MotionBlurQuality=0
