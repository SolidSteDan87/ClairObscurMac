; Profil « air » — MacBook Air M2 (GPU 8-10 cœurs, sans ventilateur) : réglages
; bas, éclairage global en espace écran, Nanite gardé (vraies fleurs sur M2).
; Non mesuré sur un Air au moment de l'écriture : à ajuster après mesure.
[SystemSettings]
sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=1
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=1
sg.EffectsQuality=0
sg.FoliageQuality=1
sg.ShadingQuality=0
sg.LandscapeQuality=1
r.VolumetricFog=0
r.TranslucencyLightingVolume=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.SceneColorFringeQuality=0
r.FidelityFX.FSR4.Enabled=0
r.NGX.DLSS.Enable=1
r.ScreenPercentage=50
r.ReflectionMethod=2
r.DynamicGlobalIlluminationMethod=2
r.Nanite.MaxPixelsPerEdge=2
; Écran 60 Hz de l'Air : avec la synchro, ~25 FPS tomberaient à 20 ; sans, ~25 réguliers
r.VSync=0
